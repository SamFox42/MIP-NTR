<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ошибка 404 - Страница не найдена</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="logoSX.png" sizes="32x32" type="image/png">
  <style>
    .error-page {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .error-logo {
      max-width: 250px;
      margin-bottom: 2rem;
      animation: float 3s ease-in-out infinite;
    }
    .error-title {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .error-text {
      font-size: 1.25rem;
      margin-bottom: 2rem;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>
<body>
  <main class="error-page">
    <img src="logo.png" alt="МИП НТР" class="error-logo">
    <h1 class="error-title">Ошибка 404</h1>
    <p class="error-text">Страница не найдена</p>
    <a href="index.html" class="btn btn-primary">Вернуться на главную</a>
  </main>
</body>
</html>
